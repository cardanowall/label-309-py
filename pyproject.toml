[build-system]
requires = ["hatchling>=1.29.0,<2"]
build-backend = "hatchling.build"

[project]
name = "cardanowall-sdk"
version = "0.7.0"
description = "Python SDK for the CardanoWall protocol — parity twin of @cardanowall/sdk-ts. Implements the Label 309 cryptographic primitives byte-identically with the TypeScript reference."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [
  { name = "CardanoWall", email = "hello@cardanowall.com" },
]
keywords = ["cardano", "label-309", "proof-of-existence", "poe", "cardanowall", "sdk"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security :: Cryptography",
  "Operating System :: OS Independent",
]
dependencies = [
  "argon2-cffi>=25,<26",
  "cbor2>=6,<7",
  "cryptography>=48.0.1,<49",
  "httpx>=0.28,<0.29",
  "kyber-py==1.2.0",
  "PyNaCl>=1.5,<2",
  "pyrage>=1.3,<2",
]

[project.urls]
Homepage = "https://github.com/cardanowall/label-309-py"
Repository = "https://github.com/cardanowall/label-309-py"
Issues = "https://github.com/cardanowall/label-309-py/issues"
Documentation = "https://github.com/cardanowall/label-309-py#readme"

[project.scripts]
cardanowall-sdk-conformance = "cardanowall.conformance.__main__:main"

[dependency-groups]
dev = [
  "pytest>=9.0.3,<10",
  "pytest-json-report>=1.5.0,<2.0.0",
  "mypy>=2.0.0,<3",
  "ruff>=0.15.0,<0.16",
  "jsonschema>=4.23.0,<5",
  "types-jsonschema>=4.23.0,<5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/cardanowall"]
# _tools holds maintainer-only fixture regenerators and a live-mainnet canary,
# invoked via `python -m cardanowall._tools.X` from the monorepo source. They
# reach into sibling packages and are not part of the published SDK, so they are
# excluded from the wheel.
exclude = ["src/cardanowall/_tools"]

[tool.hatch.build.targets.wheel.force-include]
"src/cardanowall/py.typed" = "cardanowall/py.typed"

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src", "tests"]
explicit_package_bases = true
mypy_path = "src"
warn_unused_configs = true
warn_unused_ignores = true
warn_redundant_casts = true

# kyber-py ships no py.typed marker / stubs (ML-KEM-768 for the X-Wing hybrid
# KEM). Treat it as untyped at the import boundary instead of sprinkling
# per-line ignores; our wrapper re-types everything it returns as `bytes`.
[[tool.mypy.overrides]]
module = "kyber_py.*"
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "TID", "RUF", "UP", "S"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"requests".msg = "Use httpx via the project's outbound HTTP wrapper."
"urllib3".msg = "Use httpx via the project's outbound HTTP wrapper."
"aiohttp".msg = "Use httpx via the project's outbound HTTP wrapper."
"pycryptodome".msg = "Use the closed crypto catalogue (cryptography / PyNaCl / cbor2 / argon2-cffi / pyrage)."
"Crypto".msg = "Top-level Crypto is pycryptodome — use the closed crypto catalogue."
"Cryptodome".msg = "Top-level Cryptodome is pycryptodomex (a pycryptodome sibling) — use the closed crypto catalogue."
"cryptography.hazmat.primitives.asymmetric.ed25519".msg = "cryptography's Ed25519 is cofactored (non-conformant for Label 309 strict ZIP215=false) — use nacl.signing from PyNaCl."

[tool.ruff.lint.per-file-ignores]
# S105/S106/S107: conformance tests pin literal passphrases by design.
"tests/**/*.py" = ["S101", "S105", "S106", "S107"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["-ra", "--strict-markers"]
markers = [
  "nxdomain: service-independence Layer 1 + Layer 2 tests (run via `pytest -m nxdomain`)",
]
